<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Alert | SIMS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
            background: #eef2f6;
        }

        .layout {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 250px 1fr;
        }

        .sidebar {
            background: #17324d;
            color: #ffffff;
            padding: 28px 22px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 34px;
        }

        .nav {
            display: grid;
            gap: 8px;
        }

        .nav a {
            display: block;
            padding: 12px 14px;
            color: #d7e4ef;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
        }

        .nav a:hover,
        .nav a.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }

        .main {
            padding: 32px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-bottom: 26px;
        }

        .page-title h1 {
            margin: 0 0 6px;
            font-size: 30px;
            color: #111827;
        }

        .page-title p {
            margin: 0;
            color: #64748b;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            border: 1px solid transparent;
            padding: 10px 14px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .button-primary {
            background: #1d4ed8;
            color: #ffffff;
        }

        .button-primary:hover {
            background: #1e40af;
        }

        .button-secondary {
            background: #ffffff;
            color: #334155;
            border-color: #cbd5e1;
        }

        .button-secondary:hover {
            background: #f8fafc;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d9e1ea;
            border-radius: 8px;
            padding: 22px;
            max-width: 920px;
        }

        .alert {
            display: none;
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            background: #eff6ff;
            font-size: 14px;
        }

        .alert[style],
        .alert:not(:empty) {
            display: block;
        }

        form {
            display: grid;
            gap: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: grid;
            gap: 8px;
            font-weight: 700;
            color: #263548;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 10px 12px;
            font: inherit;
            color: #111827;
            background: #ffffff;
        }

        input,
        select {
            min-height: 46px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            outline: 3px solid rgba(37, 99, 235, 0.16);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-weight: 400;
            color: #475569;
            line-height: 1.5;
        }

        .checkbox-label input {
            width: 16px;
            height: 16px;
            min-height: 16px;
            padding: 0;
            margin-top: 3px;
            flex: 0 0 auto;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: sticky;
                top: 0;
                z-index: 10;
            }
        }

        @media (max-width: 640px) {
            .main {
                padding: 20px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">SIMS</div>
            <nav class="nav" aria-label="Primary navigation">
                <a href="/dashboard">Dashboard</a>
                <a href="/products">Products</a>
                <a href="/suppliers">Suppliers</a>
                <a href="/stockin">Stock In</a>
                <a href="/stockout">Stock Out</a>
                <a href="/alerts" class="active">Alerts</a>
                <a href="/users">Users</a>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="page-title">
                    <h1>Update alert</h1>
                    <p>Edit alert details and mark it as resolved when handled.</p>
                </div>
                <div class="actions">
                    <a class="button button-secondary" href="/alerts">Back</a>
                    <a class="button button-secondary" href="/users/login">Logout</a>
                </div>
            </header>

            <section class="card" aria-label="Update alert form">
                <div class="alert" th:if="${message}" th:text="${message}"></div>

                <form th:action="@{/alerts/update/{id}(id=${alert.id})}" action="/alerts/update/ALT-001" method="post" th:object="${alert}">
                    <div class="form-grid">
                        <label>
                            Alert title
                            <input type="text" name="title" th:field="*{title}" placeholder="Low stock warning" required>
                        </label>

                        <label>
                            Alert type
                            <select name="type" th:field="*{type}" required>
                                <option value="">Select type</option>
                                <option value="LOW_STOCK">LOW_STOCK</option>
                                <option value="EXPIRED">EXPIRED</option>
                                <option value="SYSTEM">SYSTEM</option>
                                <option value="OTHER">OTHER</option>
                            </select>
                        </label>

                        <label>
                            Severity
                            <select name="severity" th:field="*{severity}" required>
                                <option value="">Select severity</option>
                                <option value="INFO">INFO</option>
                                <option value="WARNING">WARNING</option>
                                <option value="CRITICAL">CRITICAL</option>
                            </select>
                        </label>

                        <label>
                            Related product (optional)
                            <input type="text" name="productName" th:field="*{productName}" placeholder="e.g., USB Keyboard">
                        </label>

                        <label>
                            Current stock (optional)
                            <input type="number" name="currentStock" th:field="*{currentStock}" min="0" placeholder="0">
                        </label>

                        <label>
                            Reorder level (optional)
                            <input type="number" name="reorderLevel" th:field="*{reorderLevel}" min="0" placeholder="10">
                        </label>

                        <label class="full-width">
                            Message
                            <textarea name="message" th:field="*{message}" placeholder="Describe the alert..." required></textarea>
                        </label>
                    </div>

                    <label class="checkbox-label">
                        <input type="checkbox" name="resolved" th:field="*{resolved}">
                        Mark as resolved.
                    </label>

                    <div class="form-actions">
                        <button class="button button-primary" type="submit">Update alert</button>
                        <a class="button button-secondary" href="/alerts">Cancel</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
